name = "lore-llm-dev"
main = "src/index.ts"
compatibility_date = "2025-09-01"

# Free plan: 100k requests/day, 10 ms CPU per request. Everything below is
# I/O-bound (R2/D1) except JWT verification, which is a single RSA verify.
workers_dev = true

[vars]
COGNITO_REGION = "eu-north-1"
COGNITO_USER_POOL_ID = "eu-north-1_orShbeG8H"
# Comma-separated list of app client ids allowed to call the management API
COGNITO_CLIENT_IDS = "97beb3qgebbmbqrnr0erhs37v,2ij9dpmj7gacqj370obj0lehg2,730nauiaj6dc4dfjdrfvrd7eak"
# Comma-separated browser origins allowed on the management API (CORS + MCP Origin check).
# davide255.github.io: the web build of lore-llm-desktop on GitHub Pages.
ALLOWED_ORIGINS = "https://davide255.github.io"
# OAuth for /mcp (hosted connectors). Both must be set to enable it; see README "OAuth for MCP clients".
COGNITO_DOMAIN = "eu-north-1orshbeg8h.auth.eu-north-1.amazoncognito.com"
OAUTH_COGNITO_CLIENT_ID = "6mbpkbo3m6m13g5vrv5pae83sg"

[[r2_buckets]]
binding = "BUCKET"
bucket_name = "lore-llm-kb-dev"

[[d1_databases]]
binding = "DB"
database_name = "lore-llm-db-dev"
database_id = "4e3764c3-0773-44ea-9ea0-f5f8b7816fca"
migrations_dir = "migrations"

# Secret (never in this file):  wrangler secret put AGENT_TOKEN_SECRET
